<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MatrixEdu — flat 3-colour mark (QĐ7): Matrix Blue #2563EB, Matrix Amber #D97706, white.
       Motif: matrix brackets [ ] + letter M + OMR bubbles. No gradients. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#2563EB" />

  <!-- Matrix brackets [ ] -->
  <path d="M15 16 H10 V48 H15" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M49 16 H54 V48 H49" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Letter M (Matrix) -->
  <path d="M19 46 V25 L32 37 L45 25 V46" fill="none" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- OMR bubbles: amber at the centre of the M, white at the feet -->
  <circle cx="32" cy="37" r="3.2" fill="#D97706" />
  <circle cx="19" cy="46" r="3.2" fill="#FFFFFF" />
  <circle cx="45" cy="46" r="3.2" fill="#FFFFFF" />
</svg>
